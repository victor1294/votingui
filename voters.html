<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Head of House Voting</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="min-h-screen bg-slate-100">

 
  <header class="bg-slate-900 px-6 py-6 text-white">
    <div class="mx-auto max-w-5xl">

      <h1 class="text-3xl font-bold">
        Head of House Voting
      </h1>

      <p class="mt-2 text-slate-300">
        Cast your vote for your preferred candidate.
      </p>

    </div>
  </header>


 
  <main class="mx-auto max-w-5xl px-6 py-10">


   

    <section class="rounded-2xl bg-white p-7 shadow-md">

      <h2 class="text-2xl font-bold text-slate-900">
        Cast Your Vote
      </h2>

      <p class="mt-1 text-slate-500">
        Select a voter and choose a candidate.
      </p>


      <div class="mt-7 grid gap-6 md:grid-cols-2">


     

        <div>

          <label
            for="voter"
            class="mb-2 block font-semibold text-slate-700"
          >
            Voter
          </label>

          <select
            id="voter"
            class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-700 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200"
          >

            <option value="">
              Select voter
            </option>

            <option value="Stephanie">
              Stephanie
            </option>

            <option value="Rita">
              Rita
            </option>

            <option value="James">
              James
            </option>

            <option value="Peter">
              Peter
            </option>

            <option value="Victor">
              Victor
            </option>

            <option value="Anthony">
              Anthony
            </option>

            <option value="Charles">
              Charles
            </option>

            <option value="Augustine">
              Augustine
            </option>

            <option value="Lillian">
              Lillian
            </option>

            <option value="Gabriel">
              Gabriel
            </option>

            <option value="Christopher">
              Christopher
            </option>

            <option value="Kosisochukwu">
              Kosisochukwu
            </option>

            <option value="Bonaventure">
              Bonaventure
            </option>

            <option value="Abigail">
              Abigail
            </option>

            <option value="David">
              David
            </option>

            <option value="Amarachi">
              Amarachi
            </option>

            <option value="Loveth">
              Loveth
            </option>

            <option value="Chidimma">
              Chidimma
            </option>

            <option value="Ifeanyi">
              Ifeanyi
            </option>

            <option value="Majesty">
              Majesty
            </option>

          </select>

        </div>


       

        <div>

          <label
            for="candidate"
            class="mb-2 block font-semibold text-slate-700"
          >
            Candidate
          </label>

          <select
            id="candidate"
            class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-slate-700 outline-none transition focus:border-orange-500 focus:ring-2 focus:ring-orange-200"
          >

            <option value="">
              Select candidate
            </option>

            <option value="Augustine">
              Augustine
            </option>

            <option value="Kosisochukwu">
              Kosisochukwu
            </option>

          </select>

        </div>

      </div>


  

      <button
        id="cast-vote"
        type="button"
        class="mt-7 w-full rounded-lg bg-orange-500 px-5 py-3 font-semibold text-white transition hover:bg-orange-600"
      >
        Cast Vote
      </button>

    </section>





    <section class="mt-10">

      <div class="mb-6">

        <h2 class="text-2xl font-bold text-slate-900">
          Election Results
        </h2>

        <p
          id="total-votes"
          class="mt-1 text-slate-500"
        >
          0 / 20 votes cast
        </p>

      </div>


      <div class="grid gap-6 md:grid-cols-2">


      

        <div class="rounded-2xl bg-white p-6 shadow-md">

          <div class="flex items-center justify-between">

            <div>

              <p class="text-sm text-slate-500">
                Candidate
              </p>

              <h3 class="mt-1 text-xl font-bold text-slate-900">
                Augustine
              </h3>

            </div>


            <p
              id="candidate1"
              class="rounded-full bg-orange-100 px-4 py-2 font-bold text-orange-700"
            >
              Augustine: 0
            </p>

          </div>



          <div class="mt-6">

            <div class="h-4 overflow-hidden rounded-full bg-slate-200">

              <div
                id="bar-augustine"
                class="h-full rounded-full bg-orange-500 transition-all duration-500"
                style="width: 0%"
              ></div>

            </div>

          </div>

        </div>



       

        <div class="rounded-2xl bg-white p-6 shadow-md">

          <div class="flex items-center justify-between">

            <div>

              <p class="text-sm text-slate-500">
                Candidate
              </p>

              <h3 class="mt-1 text-xl font-bold text-slate-900">
                Kosisochukwu
              </h3>

            </div>


            <p
              id="candidate2"
              class="rounded-full bg-emerald-100 px-4 py-2 font-bold text-emerald-700"
            >
              Kosisochukwu: 0
            </p>

          </div>


       

          <div class="mt-6">

            <div class="h-4 overflow-hidden rounded-full bg-slate-200">

              <div
                id="bar-kosisochukwu"
                class="h-full rounded-full bg-emerald-500 transition-all duration-500"
                style="width: 0%"
              ></div>

            </div>

          </div>

        </div>

      </div>



     

      <div class="mt-8 text-center">

        <button
          id="check-result-button"
          type="button"
          class="rounded-lg bg-slate-900 px-8 py-3 font-semibold text-white transition hover:bg-slate-800"
        >
          Check Result
        </button>

      </div>

    </section>

  </main>





  <div
    id="result-dialog"
    class="fixed inset-0 hidden items-center justify-center bg-slate-900/60 px-5"
  >

    <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-2xl">


      <div class="text-center">

        <div
          class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-orange-100 text-3xl"
        >
          🏆
        </div>


        <h2
          id="result-dialog-title"
          class="mt-5 text-2xl font-bold text-slate-900"
        >
          Election Result
        </h2>


        <p
          id="check-result"
          class="mt-4 whitespace-pre-line leading-7 text-slate-600"
        >
          No votes have been cast yet.
        </p>

      </div>


    

      <button
        id="check-result-bu"
        type="button"
        class="mt-7 w-full rounded-lg bg-slate-900 px-5 py-3 font-semibold text-white transition hover:bg-slate-800"
      >
        Close
      </button>

    </div>

  </div>



 

  <script src="./tsc/advantages2.js"></script>

</body>

</html>
